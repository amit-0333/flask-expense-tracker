{% extends "base.html" %}
{% block content %}
<div class="form-wrapper">
  <h2>Edit Expense</h2>
  <form method="POST" action="{{ url_for('edit_expense', expense_id=expense.id) }}">
    <div class="form-group">
      <label>Title *</label>
      <input type="text" name="title" value="{{ expense.title }}" required/>
    </div>
    <div class="form-group">
      <label>Amount (₹) *</label>
      <input type="number" name="amount" step="0.01" value="{{ expense.amount }}" required/>
    </div>
    <div class="form-group">
      <label>Category *</label>
      <select name="category" required>
        {% for cat in ["Food","Transport","Shopping","Bills","Health","Entertainment","Education","Other"] %}
          <option {% if cat == expense.category %}selected{% endif %}>{{ cat }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="form-group">
      <label>Date *</label>
      <input type="date" name="date" value="{{ expense.date }}" required/>
    </div>
    <div class="form-group">
      <label>Note</label>
      <input type="text" name="note" value="{{ expense.note }}"/>
    </div>
    <div class="form-actions">
      <button type="submit" class="btn">Update Expense</button>
      <a href="{{ url_for('index') }}" class="btn btn-outline">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
